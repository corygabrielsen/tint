documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]

github actions:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", ".github/actions/**"]

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          [
            "Cargo.lock",
            "package-lock.json",
            "pnpm-lock.yaml",
            "yarn.lock",
            "go.sum",
            "Pipfile.lock",
            "requirements*.txt",
            "uv.lock",
            "poetry.lock",
          ]

tests:
  - changed-files:
      - any-glob-to-any-file:
          [
            "**/test/**",
            "**/tests/**",
            "**/__tests__/**",
            "**/*.test.*",
            "**/*_test.*",
            "**/*.bats",
          ]

shell:
  - changed-files:
      - any-glob-to-any-file: ["**/*.sh", "**/*.bash"]

python:
  - changed-files:
      - any-glob-to-any-file: ["**/*.py"]
